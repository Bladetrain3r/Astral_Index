name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests and pilot-tile reproduction
        run: python -m unittest discover -s tests
      - name: Rebuild every tile offline from the kept snapshots
        run: python -m astral.batch --sample 100 --offline --redo
      - name: Committed results must match the rebuild
        run: git diff --exit-code -- data/
