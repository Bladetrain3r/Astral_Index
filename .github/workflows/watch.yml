name: watch
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare the archives with the recorded state
        id: watch
        run: |
          set +e
          python -m astral.watch
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Open an issue if a release changed (once per distinct change)
        if: steps.watch.outputs.code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Archive change detected: $(sha256sum watch_report.md | cut -c1-10)"
          if [ -z "$(gh issue list --state all --search "$title in:title" --json number --jq '.[0].number')" ]; then
            gh issue create --title "$title" --body-file watch_report.md
          fi
      - name: Fail on a watcher crash
        if: steps.watch.outputs.code != '0' && steps.watch.outputs.code != '3'
        run: exit 1
